name: Bug 报告
description: 报告 tg-media-hub 的功能异常或错误行为
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈! 提交前请先检索现有 Issue, 避免重复。
        ⚠️ 日志与截图中请务必脱敏 API ID / API Hash / Bot Token / 手机号 / Session 文件名等敏感凭据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述遇到的问题与预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从初始状态到问题出现的完整操作序列。
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 出现 '...'
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      description: 问题在哪些部署方式下出现?
      options:
        - Docker Compose
        - 本地 Python (uv)
        - 两者均复现
    validations:
      required: true
  - type: input
    id: version_env
    attributes:
      label: 版本与环境
      description: 项目版本或 commit、操作系统、Python / Docker 版本等。
      placeholder: '例: commit <短哈希> / Windows 11 / Python 3.12 / Docker 27'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 粘贴任务日志或控制台输出 (提交前请脱敏 API Hash / Token / 手机号)。
      render: shell
