# Local git hooks mirroring CI checks (usage: pre-commit run --all-files)
repos:
  - repo: local
    hooks:
      - id: ruff-lint-ratchet
        name: ruff lint ratchet (baseline gate)
        entry: uv run python scripts/lint_ratchet.py
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: lint-standards
        name: lint_standards
        entry: uv run python scripts/lint_standards.py
        language: system
        pass_filenames: false
      - id: lint-bare-except
        name: lint_bare_except
        entry: uv run python scripts/lint_bare_except.py
        language: system
        pass_filenames: false
      - id: verify-docs-consistency
        name: verify_docs_consistency
        entry: uv run python scripts/verify_docs_consistency.py
        language: system
        pass_filenames: false
