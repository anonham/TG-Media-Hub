name: Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# 同分支新推送取消仍在跑的旧 run, 防止过时结果与并发堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0. 静态检查 (ruff format/check + 自研业务守卫 + mypy 首期报告)
  lint:
    name: Lint (ruff + guards + mypy report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff format check
        run: uv run ruff format --check .

      # 存量违规由计数棘轮监管 (只减不增) —— 本步骤
      # 替代裸 ruff check 成为阻塞门禁: 新增违规即红; 清偿后 --update 收紧基线。
      - name: ruff lint ratchet (baseline gate)
        run: uv run python scripts/lint_ratchet.py

      - name: 自研业务守卫 (单位/命名/裸吞/文档一致性)
        run: |
          uv run python scripts/lint_standards.py
          uv run python scripts/lint_bare_except.py
          uv run python scripts/verify_docs_consistency.py

      # mypy 静态类型检查门禁 (阻塞阻断)
      - name: mypy check
        run: uv run mypy

  # 1. Python 全量单元/集成测试 (pytest + coverage)
  # 哑凭证与本地基线运行方式一致 (环境变量优先于 .env); 所有 Telethon 客户端交互均被 mock, 不产生真实连接;
  # 无凭证场景 (fresh clone) 的 import/启动校验路径由 tests/test_config_validation.py 子进程用例专项覆盖
  pytest:
    name: Pytest (Unit & Integration Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TG_API_ID: "1"
      TG_API_HASH: dummy
      TG_BOT_TOKENS: "1:dummy"
      API_KEY: testkey
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (ffmpeg)
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest -q -n auto -m "not benchmark" --cov=app --cov-report=term --cov-report=xml

      # pipeline 包覆盖率门槛 (基准 88%, 门槛 87 留 1pt 余量)。
      # 棘轮语义: 只升不降 —— 提升覆盖率后可上调本值; 回退即红。
      - name: Pipeline coverage gate
        run: uv run coverage report --include=app/core/pipeline/* --fail-under=87

      # 全仓覆盖率门禁 (实测 86%, 严格防回退门限设为 80%)
      - name: Whole-repo coverage gate
        run: uv run coverage report --fail-under=80

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # 3. basedpyright 交叉验证与错误阻断门禁
  # 第二类型检查器门禁 —— 对 app/core/pipeline 实施 0 error 严格阻断 (不设 continue-on-error),
  # 并在 summary 中输出 warning 分布工件供持续治理。
  basedpyright-gate:
    name: basedpyright Check (Pipeline 0 Error Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: basedpyright check & report (app/core/pipeline)
        run: |
          uv run --with basedpyright==1.40.2 basedpyright app/core/pipeline --outputjson > basedpyright_report.json || true
          uv run python scripts/pyright_report_summary.py basedpyright_report.json

      - name: Upload basedpyright report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: basedpyright-report
          path: basedpyright_report.json
          retention-days: 14

  # 2. 前端质量门禁 (五连硬门禁闭环)
  frontend-build:
    name: Frontend Quality Gate (Sync, Format, Lint, Typecheck, Test & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 1. OpenAPI 契约同步守卫
        working-directory: frontend
        run: |
          pnpm run openapi-ts
          git diff --exit-code src/api/gen

      - name: 2. 格式守卫 (oxfmt)
        working-directory: frontend
        run: pnpm run format:check

      - name: 3. 静态 Lint 守卫 (oxlint)
        working-directory: frontend
        run: pnpm run lint

      - name: 4. 类型与模板守卫 (vue-tsc)
        working-directory: frontend
        run: pnpm run typecheck

      - name: 5. 单测与构建门禁 (vitest & vite build)
        working-directory: frontend
        run: pnpm run test && pnpm run build

      - name: Upload frontend static artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: static/
          retention-days: 7

  # 4. Mocked UI E2E 套件 (无依赖端到端全链路冒烟与交互闭环)
  e2e-ui-mocked:
    name: Mocked UI E2E (Playwright & Mocked API)
    needs: [frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Download frontend static artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: frontend-dist
          path: static/

      - name: Install Playwright Chromium
        run: uv run python -m playwright install --with-deps chromium

      - name: Run Mocked UI E2E Suite
        env:
          E2E_UI_MOCKED: "1"
        run: uv run pytest tests/e2e_ui/test_ui_mocked.py -v
