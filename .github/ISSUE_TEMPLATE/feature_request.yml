name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议! 描述越具体, 越容易被评估与排期。
        请确认所提能力不违反 Telegram ToS 与版权法规 (见 README 免责声明与 CODE_OF_CONDUCT.md 项目附加条款)。
  - type: textarea
    id: problem
    attributes:
      label: 问题场景
      description: 你在什么场景下遇到了什么未被满足的需求?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你期望的实现方式与交互形态。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他方案或现有的变通方法。
