# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  profile: "chill"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_filters:
    - "!uv.lock"
    - "!frontend/pnpm-lock.yaml"
    - "!frontend/src/api/gen/**"
    - "!static/**"
    - "!tests/api/openapi_snapshot.json"
    - "!app/assets/**"
