# Gitleaks 配置 (gitleaks >= 8.21 语法, CI 使用 8.30.1)
# [extend] 必须保留全部默认规则; 本文件只登记"人工核实过的假阳性",
# 条目一律使用精确字面量, 禁止放宽为通配正则。
[extend]
useDefault = true

# 单元测试固定假密钥与文档示例 (无真实凭据)
[[allowlists]]
description = "测试夹具固定假密钥与文档示例 (无真实凭据)"
regexTarget = "match"
regexes = [
  '''abcdef0123456789abcdef''',
  '''unit_test_api_key_0123456789abcdef''',
  '''standalone_secret_0123456789abcdef''',
  '''secret_ws_0123456789abcdef''',
  '''0123456789abcdef0123456789abcdef''',
]

[[allowlists]]
description = "登录挑战和运行环境测试向 monkeypatch 注入的固定假 Key"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|[/\\])tests[/\\](?:services[/\\]test_telegram_login_challenges|core[/\\]test_runtime_infrastructure)\.py$''']
regexes = [
  '''^test_api_key_123456$''',
  '''^k_rate_test_123456$''',
  '''^explicit_api_key_0123456789$''',
]
