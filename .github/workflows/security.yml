name: Security Pipeline

on:
  schedule:
    - cron: '0 2 * * 1' # 每周一 02:00 UTC 周期性安全审计
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. 密钥泄露扫描 (Gitleaks)
  gitleaks:
    name: Gitleaks (Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks (complete commit range)
        # 直接使用固定版本与 SHA-256 校验的 Gitleaks CLI，避免 gitleaks-action
        # 仅抓取 PR 前 30 个提交 (未分页) 导致超长 PR 漏扫 (CWE-693)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "Scanning PR range ${PR_BASE_SHA}..${PR_HEAD_SHA}"
            ./gitleaks git -v --redact --log-opts="-m ${PR_BASE_SHA}..${PR_HEAD_SHA}" .
          elif [ "${EVENT_NAME}" = "push" ] \
            && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "Scanning push range ${PUSH_BEFORE_SHA}..${HEAD_SHA}"
            ./gitleaks git -v --redact --log-opts="-m ${PUSH_BEFORE_SHA}..${HEAD_SHA}" .
          else
            echo "Scanning full git history (${EVENT_NAME})"
            ./gitleaks git -v --redact --log-opts="--all -m" .
          fi

  # 2. 综合 SAST 静态代码分析 (Semgrep)
  semgrep:
    name: Semgrep (Code SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:3db5c7af55eb1f512eac0abf0ab69a97b52c74b5e9a27314c221aee1a78d7ab2
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Semgrep
        run: semgrep scan --config "p/security-audit" --config "p/secrets" --config "p/owasp-top-ten" --config "p/python" --error

  # 3. Python 专项安全代码分析 (Bandit)
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        # -r app/ 扫描应用源码; -ll 仅报告中高危风险; -s B608 排除动态 SQL 占位符字符串误报
        run: bandit -r app/ -ll -s B608

  # 4. 依赖项已知漏洞分析 (pip-audit + pnpm audit)
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Export locked dependencies from uv.lock
        # 与 Dockerfile python-builder 同源导出 (--no-dev 生产面; --frozen 保证 lock 与 pyproject 同步);
        # 依赖唯一真源为 pyproject.toml + uv.lock, 手工维护的 requirements*.txt 已删除
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.audit.txt

      - name: Audit Python Dependencies (pip-audit)
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.audit.txt

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Audit Frontend Dependencies (pnpm audit)
        run: |
          cd frontend
          pnpm audit --audit-level=high

  # 5. Dockerfile 语法与容器安全规范审查 (Hadolint)
  hadolint:
    name: Hadolint (Dockerfile Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
